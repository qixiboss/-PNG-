<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑步数据叠加器 - 工具主页</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f5f7;
            --card: #ffffff;
            --ink: #101014;
            --muted: #5b6070;
            --accent: #5f5bff;
            --accent-dark: #3b35f5;
            --border: rgba(16, 16, 20, 0.08);
            --shadow: 0 24px 60px rgba(17, 19, 30, 0.12);
            --soft-shadow: 0 12px 30px rgba(17, 19, 30, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px 80px;
        }

        .container {
            background: var(--card);
            border-radius: 28px;
            padding: 48px;
            box-shadow: var(--shadow);
            max-width: 920px;
            width: 100%;
            border: 1px solid var(--border);
        }

        .hero {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 32px;
        }

        .hero-text h1 {
            font-size: clamp(2.2rem, 3vw, 3rem);
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }

        .hero-text p {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.6;
            max-width: 520px;
        }

        .hero-badge {
            background: linear-gradient(135deg, rgba(95, 91, 255, 0.15), rgba(95, 91, 255, 0.02));
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 0.9rem;
            color: var(--accent-dark);
            font-weight: 600;
            align-self: flex-start;
        }

        .demo-video-container {
            margin: 32px 0 40px;
            padding: 28px;
            background: #fafafb;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--soft-shadow);
            text-align: center;
        }

        .demo-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .demo-video {
            width: 100%;
            max-width: 640px;
            border-radius: 18px;
            box-shadow: 0 18px 40px rgba(12, 12, 24, 0.18);
            border: 1px solid rgba(15, 15, 30, 0.08);
        }

        .video-description {
            color: var(--muted);
            font-size: 0.95rem;
            margin-top: 14px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .tool-card {
            background: #fafafb;
            border-radius: 18px;
            padding: 26px;
            text-align: left;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--border);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .tool-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(95, 91, 255, 0.15), transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tool-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--soft-shadow);
            border-color: rgba(95, 91, 255, 0.3);
        }

        .tool-card:hover::after {
            opacity: 1;
        }

        .tool-icon {
            font-size: 2.4rem;
            margin-bottom: 12px;
            display: block;
        }

        .tool-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .tool-title span {
            font-size: 0.75rem;
            color: var(--accent-dark);
            font-weight: 600;
            margin-left: 6px;
        }

        .tool-description {
            color: var(--muted);
            line-height: 1.5;
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 32px 24px;
            }

            .hero {
                flex-direction: column;
            }

            .demo-video-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <div class="hero-text">
                <h1>跑步数据叠加器</h1>
                <p>以清爽的现代布局整理你的影像处理流程，快速完成裁切、抠图到数据叠加的完整链路。</p>
            </div>
            <span class="hero-badge">All-in-One Tools</span>
        </div>

        <div class="demo-video-container">
            <h2 class="demo-title">📹 如何使用</h2>
            <video class="demo-video" controls loop muted>
                <source src="how to use.mp4" type="video/mp4">
                您的浏览器不支持视频播放。
            </video>
            <p class="video-description">观看演示视频，了解工具的完整使用流程。</p>
        </div>

        <div class="tools-grid">
            <a href="batch-crop.html" class="tool-card">
                <span class="tool-icon">✂️</span>
                <div class="tool-title">批量图片裁切 <span>[Step 1]</span></div>
                <div class="tool-description">一键批量裁切多张图片为相同尺寸，提高图片处理效率。</div>
            </a>

            <a href="bg-remove.html" class="tool-card">
                <span class="tool-icon">🎨</span>
                <div class="tool-title">黑底转透明 <span>[Step 2]</span></div>
                <div class="tool-description">批量将黑色背景转换为透明背景，并导出为PNG格式。</div>
            </a>

            <a href="data-overlay.html" class="tool-card">
                <span class="tool-icon">📊</span>
                <div class="tool-title">跑步数据叠加 <span>[Step 3]</span></div>
                <div class="tool-description">将跑步数据叠加到视频或图片上，创建专业的运动数据展示效果。</div>
            </a>
        </div>
    </div>
</body>
</html>
