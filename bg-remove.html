<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>黑底转透明（批量导出PNG）</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --card: #ffffff;
      --ink: #101014;
      --muted: #5b6070;
      --accent: #5f5bff;
      --accent-dark: #3b35f5;
      --border: rgba(16, 16, 20, 0.08);
      --shadow: 0 24px 60px rgba(17, 19, 30, 0.12);
      --soft-shadow: 0 12px 30px rgba(17, 19, 30, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding: 32px 20px 80px;
      color: var(--ink);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 16px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--card);
      border-radius: 999px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
      border: 1px solid var(--border);
      box-shadow: var(--soft-shadow);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .back-link:hover {
      transform: translateY(-2px);
    }

    .page-title h2 {
      font-size: clamp(2rem, 3vw, 2.6rem);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .page-title p {
      color: var(--muted);
    }

    .row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: center;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--soft-shadow);
      border: 1px solid var(--border);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      max-width: 600px;
      flex: 1 1 320px;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: 600;
      color: var(--ink);
    }

    input[type="range"] {
      width: 100%;
      max-width: 350px;
      height: 6px;
      border-radius: 999px;
      background: #e2e3e9;
      outline: none;
      -webkit-appearance: none;
      margin: 10px 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(16, 16, 20, 0.2);
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 1px dashed rgba(16, 16, 20, 0.2);
      border-radius: 14px;
      background: #fafafb;
      transition: border-color 0.3s ease, background 0.3s ease;
    }

    input[type="file"]:hover {
      border-color: rgba(95, 91, 255, 0.5);
      background: #f4f4ff;
    }

    input[type="checkbox"] {
      margin-right: 8px;
      transform: scale(1.1);
    }

    canvas, img {
      max-width: 280px;
      border: none;
      border-radius: 16px;
      background: conic-gradient(#eee 0 25%, #fff 0 50%, #eee 0 75%, #fff 0) 0/16px 16px;
      box-shadow: var(--soft-shadow);
      transition: transform 0.3s ease;
    }

    canvas:hover, img:hover {
      transform: scale(1.02);
    }

    button {
      padding: 12px 20px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 12px 24px rgba(95, 91, 255, 0.2);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .small {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.5;
      margin-top: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
      margin-top: 30px;
      max-width: 1400px;
      margin-left: auto;
      margin-right: auto;
      padding: 0 20px;
    }

    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      box-shadow: var(--soft-shadow);
      transition: transform 0.3s ease;
    }

    .item:hover {
      transform: translateY(-1px);
    }

    .item h4 {
      margin: 0 0 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
    }

    .pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: white;
      margin-left: 8px;
      font-weight: 600;
      font-size: 0.7rem;
    }

    .fade-in {
      animation: fadeInUp 0.6s ease forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .top-bar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="back-link">
      <span>←</span>
      返回主页
    </a>
    <div class="page-title">
      <h2>批量：黑底/近黑底 → 透明背景 PNG</h2>
      <p>精准控制相似色阈值，快速输出透明背景 PNG。</p>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <label>选择图片（可多选）</label>
      <input id="file" type="file" accept="image/*" multiple />

      <label>取色模式</label>
      <div style="display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap;">
        <button id="btnColorPicker" class="pill">🖌️ 从预览图取色</button>
        <div style="display: flex; align-items: center; gap: 10px;">
          <span>目标颜色：</span>
          <div id="targetColorDisplay" style="width: 30px; height: 30px; border: 2px solid #ccc; border-radius: 50%; background-color: #000;"></div>
          <input type="text" id="targetColorText" value="#000000" style="width: 100px; padding: 5px; border: 1px solid #ccc; border-radius: 5px;">
        </div>
      </div>

      <label>颜色相似度阈值（越大：越多相似色会变透明） <span id="tVal" class="pill">32</span></label>
      <input id="thr" type="range" min="0" max="120" value="32" />

      <label>边缘柔化（抗锯齿，0-40） <span id="fVal" class="pill">10</span></label>
      <input id="feather" type="range" min="0" max="40" value="10" />

      <label><input id="keepDarkStroke" type="checkbox" checked /> 尽量保留深色描边（减少文字细边被抠掉）</label>

      <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
        <button id="btnPreview" disabled>预览第一张</button>
        <button id="btnExport" disabled>批量导出 PNG</button>
        <button id="btnExportZip" disabled>批量导出 PNG (ZIP)</button>
      </div>

      <p class="small">
        建议先点“预览第一张”，然后点击“从预览图取色”，在图片上点击要透明化的颜色，最后导出。取消勾选“尽量保留深色描边”效果会更好<br>
        调整颜色相似度阈值可以控制透明化的范围。
      </p>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <div class="small">原图</div>
          <img id="orig" alt="" />
        </div>
        <div>
          <div class="small">处理后（透明底棋盘格）</div>
          <canvas id="cv"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div id="list" class="grid"></div>

  <!-- JSZip -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <script>
    const $ = (s)=>document.querySelector(s);
    const file = $("#file");
    const thr = $("#thr");
    const feather = $("#feather");
    const tVal = $("#tVal");
    const fVal = $("#fVal");
    const keepDarkStroke = $("#keepDarkStroke");
    const btnPreview = $("#btnPreview");
    const btnExport = $("#btnExport");
    const btnExportZip = $("#btnExportZip");
    const btnColorPicker = $("#btnColorPicker");
    const targetColorDisplay = $("#targetColorDisplay");
    const targetColorText = $("#targetColorText");
    const orig = $("#orig");
    const cv = $("#cv");
    const ctx = cv.getContext("2d", { willReadFrequently:true });
    const list = $("#list");
    
    // 目标颜色（默认黑色）
    let targetColor = { r: 0, g: 0, b: 0 };
    // 是否处于取色模式
    let isColorPickerMode = false;

    let files = [];

    function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }

    // 把“目标颜色”变透明。使用颜色相似度阈值 + 可选柔化。
    function removeTargetColorToTransparent(imageData, targetColor, threshold, featherPx, protectDarkStroke){ 
      const d = imageData.data;
      // threshold: 0..255（这里UI给0..120）
      // featherPx: 0..40 表示在阈值附近做渐变
      const t = threshold;
      const f = Math.max(0, featherPx);

      for (let i=0;i<d.length;i+=4){
        const r=d[i], g=d[i+1], b=d[i+2];
        const a=d[i+3];
        if (a === 0) continue;

        // 计算与目标颜色的欧氏距离（0..441.67）
        const dr = r - targetColor.r;
        const dg = g - targetColor.g;
        const db = b - targetColor.b;
        const dist = Math.sqrt(dr*dr + dg*dg + db*db);

        // 可选：保护深色描边（避免一些深灰/深棕被误删）
        // 逻辑：如果像素“有明显色相/饱和度”（不是纯灰黑），就更倾向保留。
        let sat = 0;
        {
          const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
          sat = mx === 0 ? 0 : (mx - mn) / mx; // 0..1
        }

        // 仅对颜色相似度高的区域处理
        if (dist <= t + f){
          let alphaMul;
          if (dist <= t){
            alphaMul = 0; // 完全透明
          } else {
            // 在 (t, t+f] 做线性渐变，柔化边缘
            const k = (dist - t) / (f || 1); // 0..1
            alphaMul = k;
          }

          if (protectDarkStroke){
            // 有颜色的（sat高）更保留一点
            // sat 0..1 => boost 0..0.5
            const boost = clamp(sat * 0.6, 0, 0.6);
            alphaMul = clamp(alphaMul + boost, 0, 1);
          }

          d[i+3] = Math.round(a * alphaMul);
        }
      }
      return imageData;
    }
    
    // 取色器功能实现
    function initColorPicker() {
      // 取色按钮点击事件
      btnColorPicker.addEventListener('click', () => {
        isColorPickerMode = !isColorPickerMode;
        if (isColorPickerMode) {
          btnColorPicker.textContent = '✅ 取色模式（点击图片选择颜色）';
          btnColorPicker.style.background = '#4CAF50';
          // 添加图片点击事件监听
          orig.addEventListener('click', handleImageClick);
        } else {
          btnColorPicker.textContent = '🖌️ 从预览图取色';
          btnColorPicker.style.background = '';
          // 移除图片点击事件监听
          orig.removeEventListener('click', handleImageClick);
        }
      });
      
      // 图片点击取色处理
      function handleImageClick(e) {
        if (!isColorPickerMode) return;
        
        const rect = orig.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        // 创建一个临时canvas来获取像素颜色
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = orig.naturalWidth;
        tempCanvas.height = orig.naturalHeight;
        const tempCtx = tempCanvas.getContext('2d');
        
        // 绘制图片到临时canvas
        tempCtx.drawImage(orig, 0, 0);
        
        try {
          // 获取点击位置的像素颜色
          const pixel = tempCtx.getImageData(
            Math.round(x * (orig.naturalWidth / rect.width)),
            Math.round(y * (orig.naturalHeight / rect.height)),
            1, 1
          ).data;
          
          // 更新目标颜色
          targetColor = {
            r: pixel[0],
            g: pixel[1],
            b: pixel[2]
          };
          
          // 更新UI显示
          const hexColor = rgbToHex(targetColor.r, targetColor.g, targetColor.b);
          targetColorDisplay.style.backgroundColor = hexColor;
          targetColorText.value = hexColor;
          
          // 显示成功提示
          alert(`成功取色：${hexColor}`);
          
          // 自动退出取色模式
          isColorPickerMode = false;
          btnColorPicker.textContent = '🖌️ 从预览图取色';
          btnColorPicker.style.background = '';
          orig.removeEventListener('click', handleImageClick);
          
          // 如果已经有预览，重新生成预览
          if (files.length > 0) {
            btnPreview.click();
          }
        } catch (error) {
          console.error('取色失败:', error);
          alert('取色失败，请确保图片已正确加载');
        }
      }
      
      // RGB转Hex工具函数
      function rgbToHex(r, g, b) {
        return '#' + [r, g, b].map(x => {
          const hex = x.toString(16);
          return hex.length === 1 ? '0' + hex : hex;
        }).join('');
      }
      
      // Hex转RGB工具函数
      function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
          r: parseInt(result[1], 16),
          g: parseInt(result[2], 16),
          b: parseInt(result[3], 16)
        } : null;
      }
      
      // 颜色文本输入框变化处理
      targetColorText.addEventListener('input', (e) => {
        const hex = e.target.value;
        const rgb = hexToRgb(hex);
        if (rgb) {
          targetColor = rgb;
          targetColorDisplay.style.backgroundColor = hex;
        }
      });
    }
    
    // 初始化取色器
    initColorPicker();

    async function fileToImage(f){
      const url = URL.createObjectURL(f);
      const img = new Image();
      img.decoding = "async";
      img.src = url;
      await img.decode();
      URL.revokeObjectURL(url);
      return img;
    }

    async function processOne(f){ 
      const img = await fileToImage(f);
      const w = img.naturalWidth, h = img.naturalHeight;
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const cctx = c.getContext("2d", { willReadFrequently:true });
      cctx.drawImage(img,0,0);
      const id = cctx.getImageData(0,0,w,h);
      // 使用目标颜色进行透明处理
      const out = removeTargetColorToTransparent(id, targetColor, +thr.value, +feather.value, keepDarkStroke.checked);
      cctx.putImageData(out,0,0);
      return c;
    }

    function setPreview(img, outCanvas){
      orig.src = img.src || "";
      cv.width = outCanvas.width;
      cv.height = outCanvas.height;
      ctx.clearRect(0,0,cv.width,cv.height);
      ctx.drawImage(outCanvas,0,0);
    }

    function renderList(){
      list.innerHTML = "";
      files.forEach((f, idx)=>{
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<h4>${idx+1}. ${f.name}</h4>
          <div class="small">导出：${f.name.replace(/\.[^.]+$/,'')}.png</div>`;
        list.appendChild(div);
      });
    }

    file.addEventListener("change", ()=>{
      files = Array.from(file.files || []);
      btnPreview.disabled = files.length === 0;
      btnExport.disabled = files.length === 0;
      btnExportZip.disabled = files.length === 0;
      renderList();
    });
    
    // 检查是否有第一步传来的裁剪图片
    document.addEventListener('DOMContentLoaded', () => {
      const croppedImages = localStorage.getItem('croppedImages');
      if (croppedImages) {
        const images = JSON.parse(croppedImages);
        console.log('检测到第一步传来的裁剪图片，共', images.length, '张');
        
        // 添加从第一步导入的按钮
        const importBtn = document.createElement('button');
        importBtn.textContent = `导入第一步的 ${images.length} 张裁剪图片`;
        importBtn.style.marginTop = '10px';
        importBtn.onclick = () => {
          // 将localStorage中的图片转换为File对象
          files = images.map(img => {
            // 从dataURL创建Blob
            const byteString = atob(img.dataUrl.split(',')[1]);
            const mimeString = img.dataUrl.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
              ia[i] = byteString.charCodeAt(i);
            }
            const blob = new Blob([ab], {type: mimeString});
            return new File([blob], img.name, {type: mimeString});
          });
          
          btnPreview.disabled = files.length === 0;
          btnExport.disabled = files.length === 0;
          btnExportZip.disabled = files.length === 0;
          renderList();
          alert(`已导入 ${images.length} 张裁剪图片！`);
        };
        
        document.querySelector('.card').appendChild(importBtn);
      }
    });

    thr.addEventListener("input", ()=> tVal.textContent = thr.value);
    feather.addEventListener("input", ()=> fVal.textContent = feather.value);

    btnPreview.addEventListener("click", async ()=>{
      if (!files.length) return;
      const img = await fileToImage(files[0]);
      orig.src = img.src; // 这里img.src是blob临时url，已revoke；所以重新做一个url
      // 上面 revoke 后 orig 可能显示不了，因此改为重新创建：
      orig.src = URL.createObjectURL(files[0]);
      orig.onload = ()=> URL.revokeObjectURL(orig.src);

      const out = await processOne(files[0]);
      cv.width = out.width; cv.height = out.height;
      ctx.drawImage(out,0,0);
    });

    // 批量导出PNG到选择的文件夹（现代浏览器）
    btnExport.addEventListener("click", async ()=>{
      if (!files.length) return;
      btnExport.disabled = true;
      btnExport.textContent = "处理中…";

      const transparentImages = [];
      let successCount = 0;
      
      try {
        // 检查浏览器是否支持文件系统API
        if ('showDirectoryPicker' in window) {
          // 让用户选择目标文件夹
          const directoryHandle = await window.showDirectoryPicker();
          
          for (const f of files) {
            try {
              const outCanvas = await processOne(f);
              const blob = await new Promise(res=> outCanvas.toBlob(res, "image/png"));
              const outName = f.name.replace(/\.[^.]+$/,'') + ".png";
              
              // 直接保存到用户选择的文件夹
              const fileHandle = await directoryHandle.getFileHandle(outName, { create: true });
              const writable = await fileHandle.createWritable();
              await writable.write(blob);
              await writable.close();
              
              successCount++;
              
              // 存储到localStorage，供第三步使用
              const reader = new FileReader();
              reader.onload = (e) => {
                transparentImages.push({
                  name: outName,
                  dataUrl: e.target.result
                });
              };
              reader.readAsDataURL(blob);
            } catch (error) {
              console.error('导出失败:', error);
              alert(`导出 ${f.name} 失败: ${error.message}`);
            }
          }
        } else {
          // 浏览器不支持文件系统API，提示用户使用ZIP导出
          alert('您的浏览器不支持直接保存到文件夹功能，请使用ZIP导出或升级到现代浏览器（如Chrome、Edge 86+）');
          btnExportZip.click(); // 自动触发ZIP导出
          btnExport.textContent = "批量导出 PNG";
          btnExport.disabled = false;
          return;
        }
      } catch (error) {
        if (error.name === 'AbortError') {
          // 用户取消了文件夹选择
          btnExport.textContent = "批量导出 PNG";
          btnExport.disabled = false;
          return;
        }
        console.error('导出失败:', error);
        alert(`导出失败: ${error.message}`);
      }

      // 存储所有透明图片到localStorage，供第三步使用
      localStorage.setItem('transparentImages', JSON.stringify(transparentImages));
      console.log('已存储透明图片到localStorage，共', transparentImages.length, '张');
      
      btnExport.textContent = `导出成功 ${successCount}/${files.length} 张！`;
      
      setTimeout(() => {
        btnExport.textContent = "批量导出 PNG";
        btnExport.disabled = false;
      }, 2000);
    });
    
    // ZIP导出功能
    btnExportZip.addEventListener("click", async ()=>{
      if (!files.length) return;
      btnExportZip.disabled = true;
      btnExportZip.textContent = "处理中…";

      const zip = new JSZip();
      const transparentImages = [];
      
      for (const f of files){
        const outCanvas = await processOne(f);
        const blob = await new Promise(res=> outCanvas.toBlob(res, "image/png"));
        const outName = f.name.replace(/\.[^.]+$/,'') + ".png";
        zip.file(outName, blob);
        
        // 存储到localStorage，供第三步使用
        const reader = new FileReader();
        reader.onload = (e) => {
          transparentImages.push({
            name: outName,
            dataUrl: e.target.result
          });
        };
        reader.readAsDataURL(blob);
      }
      const zipBlob = await zip.generateAsync({type:"blob"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(zipBlob);
      a.download = "png_export.zip";
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 1000);

      // 存储所有透明图片到localStorage，供第三步使用
      localStorage.setItem('transparentImages', JSON.stringify(transparentImages));
      console.log('已存储透明图片到localStorage，共', transparentImages.length, '张');

      btnExportZip.textContent = "导出成功！";
      setTimeout(() => {
        btnExportZip.textContent = "批量导出 PNG (ZIP)";
        btnExportZip.disabled = false;
      }, 2000);
    });
  </script>
</body>
</html>
